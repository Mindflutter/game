<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Abyss</title>
<style>
  html, body { margin: 0; height: 100%; background: #04070d; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ---------- the arena ----------
// The game always plays out in a 1280x800 world, whatever the window size,
// so difficulty doesn't depend on your monitor. We scale that world up to
// fill the window. Any leftover margin is the same near-black as the
// background, so the letterboxing is invisible.
const ARENA_W = 1280;
const ARENA_H = 800;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let scale = 1, offX = 0, offY = 0;
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  scale = Math.min(canvas.width / ARENA_W, canvas.height / ARENA_H);
  offX = (canvas.width  - ARENA_W * scale) / 2;
  offY = (canvas.height - ARENA_H * scale) / 2;
}
window.addEventListener('resize', resize);
resize();

// ---------- input ----------
// Remember which keys are held down right now.
const keys = new Set();
window.addEventListener('keydown', e => keys.add(e.key.toLowerCase()));
window.addEventListener('keyup',   e => keys.delete(e.key.toLowerCase()));

const BULLET_SPEED = 430;   // pixels per second
const GEM_PULL     = 300;   // how fast gems fly to you once in range
const GEM_LIFE     = 8;     // seconds before an uncollected gem fades out
const XP_GROWTH    = 1.45;  // each level costs this much more than the last
const ENEMY_RAMP   = 0.006; // enemies spawn this much faster-moving per second

let bulletId = 0;           // so a piercing shot can't hit the same enemy twice

// ---------- sound ----------
// Every sound is an oscillator and a fading volume envelope. No audio files.
// Browsers refuse to make noise until the user has interacted, so the audio
// context is created on the first key press.
let audio = null;
let muted = false;

window.addEventListener('keydown', () => {
  if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
}, { once: true });

window.addEventListener('keydown', e => {
  if (e.key.toLowerCase() === 'm') muted = !muted;
});

function sound(freq, dur, type = 'square', vol = 0.05, slide = 1) {
  if (!audio || muted) return;
  const t = audio.currentTime;
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if (slide !== 1) {
    osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur);
  }
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);   // never ramp to 0
  osc.connect(gain).connect(audio.destination);
  osc.start(t);
  osc.stop(t + dur);
}

// ---------- upgrades ----------
// Just data. Adding one is a new line here and nothing else.
const UPGRADES = [
  { name: 'Rapid Fire', desc: '+35% fire rate',        apply: p => p.fireRate *= 1.35 },
  { name: 'Power',      desc: '+1 damage',             apply: p => p.damage += 1 },
  { name: 'Reach',      desc: '+70 firing range',      apply: p => p.range += 70 },
  { name: 'Fins',       desc: '+45 move speed',        apply: p => p.speed += 45 },
  { name: 'Pierce',     desc: 'shots pass through +1', apply: p => p.pierce += 1 },
  { name: 'Lure',       desc: '+45 pickup range',      apply: p => p.pickupRange += 45 },
  { name: 'Vitality',   desc: '+1 max HP, heal 1',     apply: p => { p.maxHp += 1; p.hp += 1; } },
];

function rollUpgrades() {
  const pool = UPGRADES.slice();       // a copy, so we don't wreck the original
  const out = [];
  while (out.length < 3 && pool.length) {
    out.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  }
  return out;
}

// ---------- enemy types ----------
// Also just data. Each one unlocks partway into a run and is picked by weight,
// so the swarm gets more varied the longer you last.
const ENEMY_TYPES = [
  { name: 'drifter', r: 9,  hp: 1, speed: 85,  xp: 1, weight: 6, from: 0,
    color: '#e8446e', glow: '#ff1e5a' },
  { name: 'darter',  r: 6,  hp: 1, speed: 190, xp: 1, weight: 3, from: 25,
    color: '#ffb648', glow: '#ff8a00' },
  { name: 'bulwark', r: 17, hp: 6, speed: 52,  xp: 3, weight: 2, from: 50,
    color: '#a05cff', glow: '#7b2fff' },
];

function pickEnemyType() {
  const open = ENEMY_TYPES.filter(t => elapsed >= t.from);
  const total = open.reduce((sum, t) => sum + t.weight, 0);
  let r = Math.random() * total;
  for (const t of open) { r -= t.weight; if (r <= 0) return t; }
  return open[0];
}

// ---------- game state ----------
// Everything a run owns lives here, so restarting is one call.
let player, enemies, bullets, gems, particles;
let elapsed, spawnTimer, kills, dead, shake;
let xp, xpNext, level, paused, choices;

function reset() {
  player = {
    x: ARENA_W / 2,
    y: ARENA_H / 2,
    r: 10,             // radius, in pixels
    speed: 260,        // pixels per second
    hp: 3,
    maxHp: 3,
    hurt: 0,           // seconds of invulnerability left
    fireRate: 2.5,     // shots per second
    fireTimer: 0,      // seconds until the next shot
    damage: 1,
    range: 250,        // how far a shot travels before it dies
    pierce: 0,         // extra enemies a shot passes through
    pickupRange: 75,
  };
  enemies = [];
  bullets = [];
  gems = [];
  particles = [];
  elapsed = 0;         // seconds survived
  spawnTimer = 0;
  kills = 0;
  dead = false;
  shake = 0;           // pixels of screen shake left

  xp = 0;
  xpNext = 5;
  level = 1;
  paused = false;      // true while you're picking an upgrade
  choices = [];
}

// ---------- spawning ----------
function spawnEnemy() {
  const m = 40;                                  // how far outside the arena
  const edge = Math.floor(Math.random() * 4);    // 0 top, 1 right, 2 bottom, 3 left
  let x, y;
  if      (edge === 0) { x = Math.random() * ARENA_W;  y = -m; }
  else if (edge === 1) { x = ARENA_W + m;              y = Math.random() * ARENA_H; }
  else if (edge === 2) { x = Math.random() * ARENA_W;  y = ARENA_H + m; }
  else                 { x = -m;                       y = Math.random() * ARENA_H; }

  // Later arrivals swim faster, so kiting stops working on its own.
  const t = pickEnemyType();
  const speed = t.speed * (0.85 + Math.random() * 0.3) * (1 + elapsed * ENEMY_RAMP);
  enemies.push({ x, y, r: t.r, speed, hp: t.hp, maxHp: t.hp, xp: t.xp,
                 color: t.color, glow: t.glow, lastHitBy: 0 });
}

// A puff of shrinking sparks. Purely decorative, but it's what makes a kill
// feel like an event rather than an object disappearing.
function burst(x, y, color, glow, count, speed, life = 0.45) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = speed * (0.3 + Math.random() * 0.7);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
                     life, maxLife: life, r: 3, color, glow });
  }
}

// Closest enemy inside firing range, or null if nothing is close enough.
// Starting the search at player.range does both jobs at once.
function nearestEnemy() {
  let best = null, bestDist = player.range;
  for (const e of enemies) {
    const d = Math.hypot(e.x - player.x, e.y - player.y);
    if (d < bestDist) { bestDist = d; best = e; }
  }
  return best;
}

function gainXp() {
  xp += 1;
  if (xp < xpNext) return;
  xp -= xpNext;
  level += 1;
  // Geometric, not linear: XP income compounds as you level, so its cost has to.
  xpNext = Math.round(5 * Math.pow(XP_GROWTH, level - 1));
  choices = rollUpgrades();
  paused = true;
  sound(520, 0.09, 'triangle', 0.07);
  sound(780, 0.16, 'triangle', 0.06, 1.25);
}

// ---------- update: move everything ----------
function update(dt) {
  if (dead) {
    if (keys.has('r')) reset();
    return;
  }

  // Picking an upgrade. The whole game is frozen until you choose.
  if (paused) {
    for (let i = 0; i < choices.length; i++) {
      if (keys.has(String(i + 1))) {
        choices[i].apply(player);
        keys.delete(String(i + 1));   // force a fresh press next time
        choices = [];
        paused = false;
        break;
      }
    }
    return;
  }

  elapsed += dt;
  if (player.hurt > 0) player.hurt -= dt;

  // --- move the player ---
  let dx = 0, dy = 0;
  if (keys.has('a') || keys.has('arrowleft'))  dx -= 1;
  if (keys.has('d') || keys.has('arrowright')) dx += 1;
  if (keys.has('w') || keys.has('arrowup'))    dy -= 1;
  if (keys.has('s') || keys.has('arrowdown'))  dy += 1;

  // Holding two keys would otherwise move you 1.41x faster diagonally.
  const len = Math.hypot(dx, dy);
  if (len > 0) { dx /= len; dy /= len; }

  player.x += dx * player.speed * dt;
  player.y += dy * player.speed * dt;
  player.x = Math.max(player.r, Math.min(ARENA_W - player.r, player.x));
  player.y = Math.max(player.r, Math.min(ARENA_H - player.r, player.y));

  // --- spawn new enemies, faster as time goes on ---
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnEnemy();
    spawnTimer = Math.max(0.15, 1.2 - elapsed * 0.02);
  }

  // --- the weapon fires itself at whoever is closest, if anyone is in range ---
  player.fireTimer -= dt;
  if (player.fireTimer <= 0) {
    const target = nearestEnemy();
    if (target) {                      // nothing in range? hold the shot
      const tx = target.x - player.x;
      const ty = target.y - player.y;
      const d = Math.hypot(tx, ty) || 1;
      bullets.push({
        id: ++bulletId,
        x: player.x, y: player.y, r: 4,
        vx: (tx / d) * BULLET_SPEED,
        vy: (ty / d) * BULLET_SPEED,
        pierce: player.pierce,
        travelled: 0,
        maxTravel: player.range,       // the ring means what it says
      });
      player.fireTimer = 1 / player.fireRate;
      sound(680, 0.05, 'square', 0.025, 0.55);
    }
  }

  // --- move enemies toward the player, and hurt him on contact ---
  for (const e of enemies) {
    const ex = player.x - e.x;
    const ey = player.y - e.y;
    const d = Math.hypot(ex, ey) || 1;      // || 1 avoids dividing by zero

    e.x += (ex / d) * e.speed * dt;
    e.y += (ey / d) * e.speed * dt;

    if (d < e.r + player.r && player.hurt <= 0) {
      player.hp -= 1;
      player.hurt = 1;                       // one second of invulnerability
      shake = 14;
      burst(player.x, player.y, '#bffcff', '#4ff0ff', 14, 200, 0.5);
      sound(110, 0.28, 'sawtooth', 0.13, 0.4);
      if (player.hp <= 0) {
        dead = true;
        shake = 26;
        sound(70, 0.9, 'sawtooth', 0.16, 0.3);
      }
    }
  }

  // --- move bullets; they die at the edge of your range ---
  for (const b of bullets) {
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.travelled += BULLET_SPEED * dt;
    if (b.travelled >= b.maxTravel) b.gone = true;
  }

  // --- bullets vs enemies ---
  // ponytail: every bullet against every enemy. Fine to a few hundred of each;
  // if it ever chugs, bucket entities into a grid and only compare neighbours.
  for (const b of bullets) {
    if (b.gone) continue;
    for (const e of enemies) {
      if (e.gone) continue;
      if (Math.hypot(e.x - b.x, e.y - b.y) < e.r + b.r) {
        if (e.lastHitBy === b.id) continue;   // a shot hits each enemy at most once
        e.lastHitBy = b.id;
        e.hp -= player.damage;
        e.flash = 0.07;                       // a white frame or two on impact
        if (e.hp <= 0) {
          e.gone = true;
          kills += 1;
          for (let n = 0; n < e.xp; n++) {
            gems.push({ x: e.x + (Math.random() - 0.5) * 18,
                        y: e.y + (Math.random() - 0.5) * 18, r: 4, life: GEM_LIFE });
          }
          burst(e.x, e.y, e.color, e.glow, 6 + e.maxHp, 130 + e.maxHp * 12);
          sound(200 - e.maxHp * 8, 0.11, 'sawtooth', 0.05, 0.45);
        }
        if (b.pierce > 0) { b.pierce -= 1; }
        else { b.gone = true; break; }
      }
    }
  }

  // --- gems drift to you when close, fade out if you never come ---
  for (const g of gems) {
    g.life -= dt;
    if (g.life <= 0) { g.gone = true; continue; }

    const gx = player.x - g.x;
    const gy = player.y - g.y;
    const d = Math.hypot(gx, gy) || 1;

    if (d < player.pickupRange) {
      g.x += (gx / d) * GEM_PULL * dt;
      g.y += (gy / d) * GEM_PULL * dt;
    }
    if (d < player.r + g.r + 4) {
      g.gone = true;
      sound(1150, 0.05, 'sine', 0.03, 1.3);
      gainXp();
    }
  }

  // --- sparks fly out, slow down and fade ---
  // Drag has to be per second, not per frame: `vx *= 0.92` every frame would
  // slow sparks 2.4x faster on a 144Hz screen than on a 60Hz one.
  const drag = Math.pow(0.06, dt);      // down to 6% of speed each second
  for (const p of particles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= drag;
    p.vy *= drag;
    p.life -= dt;
  }

  for (const e of enemies) if (e.flash > 0) e.flash -= dt;
  if (shake > 0) shake = Math.max(0, shake - dt * 45);

  // Sweep up everything marked during this frame. Never remove things from
  // an array while you are still looping over it.
  enemies = enemies.filter(e => !e.gone);
  bullets = bullets.filter(b => !b.gone);
  gems    = gems.filter(g => !g.gone);
  particles = particles.filter(p => p.life > 0);
}

// ---------- draw: paint one frame ----------
function circle(x, y, r, fill, glow, blur = 20) {
  ctx.shadowBlur = blur;
  ctx.shadowColor = glow;
  ctx.fillStyle = fill;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
}

function drawUpgradeCards() {
  ctx.fillStyle = 'rgba(4, 7, 13, 0.82)';
  ctx.fillRect(0, 0, ARENA_W, ARENA_H);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#9ef7ff';
  ctx.font = '30px system-ui, sans-serif';
  ctx.fillText('LEVEL ' + level, ARENA_W / 2, ARENA_H / 2 - 130);

  const w = 220, h = 140, gap = 24;
  const totalW = choices.length * w + (choices.length - 1) * gap;
  const left = ARENA_W / 2 - totalW / 2;
  const top  = ARENA_H / 2 - h / 2;

  choices.forEach((u, i) => {
    const x = left + i * (w + gap);
    ctx.fillStyle = 'rgba(16, 44, 58, 0.92)';
    ctx.fillRect(x, top, w, h);
    ctx.strokeStyle = '#2b6b7d';
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, top + 0.5, w - 1, h - 1);

    ctx.fillStyle = '#bffcff';
    ctx.font = '19px system-ui, sans-serif';
    ctx.fillText(u.name, x + w / 2, top + 48);

    ctx.fillStyle = '#7fb0c0';
    ctx.font = '13px system-ui, sans-serif';
    ctx.fillText(u.desc, x + w / 2, top + 78);

    ctx.fillStyle = '#4ff0ff';
    ctx.font = '16px system-ui, sans-serif';
    ctx.fillText('[ ' + (i + 1) + ' ]', x + w / 2, top + 114);
  });
}

function draw() {
  // Paint the whole window, including the letterbox margin, then switch
  // into arena coordinates and clip so nothing spills into the margin.
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#04070d';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.setTransform(scale, 0, 0, scale, offX, offY);
  ctx.beginPath();
  ctx.rect(0, 0, ARENA_W, ARENA_H);
  ctx.clip();

  // Shake the contents, not the clip window, so the arena edge stays put.
  if (shake > 0) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  }

  // How far your shots reach — the player needs to see this.
  ctx.strokeStyle = 'rgba(79, 240, 255, 0.10)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.range, 0, Math.PI * 2);
  ctx.stroke();

  // Gems blink for their last two seconds, then they're gone.
  for (const g of gems) {
    if (g.life < 2 && Math.floor(g.life * 8) % 2 === 0) continue;
    circle(g.x, g.y, g.r, '#a8ffd8', '#2affb0', 14);
  }

  // A wounded enemy shrinks, so you can see a big one is nearly finished,
  // and flashes white for a frame or two when hit.
  for (const e of enemies) {
    const hit = e.flash > 0;
    circle(e.x, e.y, e.r * (0.7 + 0.3 * e.hp / e.maxHp),
           hit ? '#ffffff' : e.color, hit ? '#ffffff' : e.glow, 18);
  }

  // Sparks shrink as they die.
  for (const p of particles) {
    circle(p.x, p.y, p.r * (p.life / p.maxLife), p.color, p.glow, 10);
  }

  // Bullets are streaks, not dots — so they don't read as gems, and so you
  // can see which way they're going.
  ctx.shadowBlur = 12;
  ctx.shadowColor = '#9ef7ff';
  ctx.strokeStyle = '#eaffff';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  for (const b of bullets) {
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x - b.vx * 0.035, b.y - b.vy * 0.035);
    ctx.stroke();
  }
  ctx.shadowBlur = 0;

  // Blink while invulnerable, so getting hit is visible.
  const blinking = player.hurt > 0 && Math.floor(player.hurt * 10) % 2 === 0;
  if (!blinking) circle(player.x, player.y, player.r, '#bffcff', '#4ff0ff', 25);

  // --- XP bar across the very top ---
  ctx.fillStyle = '#12303a';
  ctx.fillRect(0, 0, ARENA_W, 5);
  ctx.fillStyle = '#4ff0ff';
  ctx.fillRect(0, 0, ARENA_W * (xp / xpNext), 5);

  // --- HUD ---
  ctx.fillStyle = '#7fb0c0';
  ctx.font = '14px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('HP ' + player.hp + '/' + player.maxHp + '   LV ' + level +
               '   ' + elapsed.toFixed(1) + 's   ' + kills + ' killed' +
               (muted ? '   [M] muted' : ''), 16, 30);

  if (paused) drawUpgradeCards();

  if (dead) {
    ctx.fillStyle = 'rgba(4, 7, 13, 0.75)';
    ctx.fillRect(0, 0, ARENA_W, ARENA_H);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff5c85';
    ctx.font = '44px system-ui, sans-serif';
    ctx.fillText('CONSUMED', ARENA_W / 2, ARENA_H / 2 - 10);

    ctx.fillStyle = '#7fb0c0';
    ctx.font = '16px system-ui, sans-serif';
    ctx.fillText('level ' + level + ', survived ' + elapsed.toFixed(1) + 's, killed ' +
                 kills + '  —  press R', ARENA_W / 2, ARENA_H / 2 + 26);
  }

  ctx.restore();
}

// ---------- the loop ----------
let last = performance.now();
function frame(now) {
  // Seconds since the previous frame. Capped, so that switching tabs
  // for a minute doesn't teleport everything across the screen.
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;

  update(dt);
  draw();
  requestAnimationFrame(frame);
}

reset();

// ---------- checks: open game.html?test and look at the console ----------
if (location.search === '?test') {
  const mob = (x, y, over) => Object.assign(
    { x, y, r: 9, speed: 0, hp: 1, maxHp: 1, xp: 1, lastHitBy: 0 }, over);

  for (let i = 0; i < 300; i++) spawnEnemy();
  console.assert(
    enemies.every(e => e.x < 0 || e.x > ARENA_W || e.y < 0 || e.y > ARENA_H),
    'enemies must spawn outside the arena');
  console.assert(
    new Set(enemies.map(e => e.speed)).size > 1,
    'enemies should not all move at the same speed');

  // Enemy types unlock as the run goes on.
  reset();
  elapsed = 0;
  console.assert(
    new Set(Array.from({ length: 50 }, () => pickEnemyType().name)).size === 1,
    'only drifters at the start of a run');
  elapsed = 60;
  const seen = new Set(Array.from({ length: 400 }, () => pickEnemyType().name));
  console.assert(seen.size === ENEMY_TYPES.length,
    'every type should appear later, saw: ' + [...seen].join(','));

  // Walking an enemy into a standing player must cost exactly one hp.
  reset();
  enemies.push(mob(player.x + 200, player.y, { speed: 100, hp: 999, maxHp: 999 }));
  for (let i = 0; i < 150; i++) update(0.016);   // 2.4s: touches once, not twice
  console.assert(player.hp === 2, 'one touch = one hp, got ' + player.hp);

  // The weapon ignores anything beyond its range, and targets the closest.
  reset();
  enemies.push(mob(player.x + player.range + 60, player.y));
  console.assert(nearestEnemy() === null, 'must not target beyond range');
  const close = mob(player.x + 40, player.y);
  enemies.push(close);
  console.assert(nearestEnemy() === close, 'must target the closest enemy in range');

  // A shot dies once it has flown its range, rather than crossing the arena.
  reset();
  bullets.push({ id: ++bulletId, x: 100, y: 400, r: 4, vx: BULLET_SPEED, vy: 0,
                 pierce: 0, travelled: 0, maxTravel: 200 });
  for (let i = 0; i < 40; i++) update(1 / 60);   // long enough to fly 280px
  console.assert(bullets.length === 0, 'shots must expire at the edge of their range');

  // A piercing shot passes through, but only damages each enemy once.
  reset();
  const tank = mob(player.x + 100, player.y, { hp: 3, maxHp: 3 });
  enemies.push(tank);
  player.fireTimer = 999;                        // silence the auto-weapon
  bullets.push({ id: ++bulletId, x: player.x, y: player.y, r: 4,
                 vx: BULLET_SPEED, vy: 0, pierce: 2, travelled: 0, maxTravel: 300 });
  for (let i = 0; i < 30; i++) update(1 / 60);
  console.assert(tank.hp === 2, 'a piercing shot must hit once, hp=' + tank.hp);

  // A tough enemy survives a hit that would kill a drifter.
  reset();
  const big = mob(player.x + 120, player.y, { hp: 6, maxHp: 6, xp: 3 });
  enemies.push(big);
  for (let i = 0; i < 45; i++) update(1 / 60);
  console.assert(big.hp < 6 && kills === 0, 'a bulwark must not die to one shot');

  // Shooting a drifter kills it and drops a gem.
  reset();
  enemies.push(mob(player.x + 150, player.y));
  for (let i = 0; i < 60; i++) update(0.016);    // ~1s
  console.assert(kills === 1, 'expected one kill, got ' + kills);
  console.assert(gems.length === 1, 'a kill must drop a gem');

  // A tougher enemy is worth more gems. Keep it outside pickupRange, or the
  // gems get vacuumed up the moment they drop and there is nothing to count.
  reset();
  enemies.push(mob(player.x + 150, player.y, { hp: 1, maxHp: 6, xp: 3 }));
  for (let i = 0; i < 60; i++) update(0.016);
  console.assert(gems.length === 3, 'xp 3 must drop 3 gems, got ' + gems.length);

  // An ignored gem fades out instead of littering the floor forever.
  reset();
  gems.push({ x: 40, y: 40, r: 4, life: 0.5 });
  for (let i = 0; i < 60; i++) update(1 / 60);
  console.assert(gems.length === 0, 'uncollected gems must expire');

  // Levelling costs more each time, rather than less.
  const costs = [];
  for (let lv = 1; lv <= 6; lv++) costs.push(Math.round(5 * Math.pow(XP_GROWTH, lv - 1)));
  console.assert(costs.every((c, i) => i === 0 || c > costs[i - 1]),
    'xp cost must rise every level: ' + costs.join(','));

  // Collecting the last gem you need levels you up and pauses the game.
  reset();
  xp = xpNext - 1;
  gems.push({ x: player.x, y: player.y, r: 4, life: GEM_LIFE });
  update(0.016);
  console.assert(level === 2 && paused, 'last gem must level you up and pause');
  console.assert(choices.length === 3, 'a level-up offers 3 choices');
  console.assert(new Set(choices).size === 3, 'the 3 choices must be different');

  // Pressing its number applies the upgrade and resumes play.
  const before = player.speed;
  choices = [UPGRADES.find(u => u.name === 'Fins')];
  keys.add('1');
  update(0.016);
  keys.delete('1');
  console.assert(!paused && player.speed > before, 'picking must apply the upgrade and resume');

  // Sparks appear on a kill, then clean themselves up.
  reset();
  burst(100, 100, '#fff', '#fff', 8, 150, 0.2);
  console.assert(particles.length === 8, 'burst must make 8 sparks');
  for (let i = 0; i < 30; i++) update(1 / 60);   // 0.5s, well past their 0.2s life
  console.assert(particles.length === 0, 'sparks must expire, left ' + particles.length);

  // Spark drag must be per second, not per frame: half a second of flight
  // has to land in the same place at 60fps and at 144fps.
  reset();
  particles.push({ x: 0, y: 0, vx: 200, vy: 0, life: 9, maxLife: 9, r: 3, color: '#fff', glow: '#fff' });
  for (let i = 0; i < 30; i++) update(1 / 60);
  const at60 = particles[0].x;
  reset();
  particles.push({ x: 0, y: 0, vx: 200, vy: 0, life: 9, maxLife: 9, r: 3, color: '#fff', glow: '#fff' });
  for (let i = 0; i < 72; i++) update(1 / 144);
  const at144 = particles[0].x;
  console.assert(Math.abs(at60 - at144) < 1,
    'spark drag must not depend on frame rate: ' + at60.toFixed(2) + ' vs ' + at144.toFixed(2));

  // Getting hit shakes the screen, and the shake settles back to nothing.
  reset();
  // 15px apart: closer than the radii add up to (9 + 10), so they touch.
  enemies.push(mob(player.x + 15, player.y, { speed: 0, hp: 999, maxHp: 999 }));
  update(1 / 60);
  console.assert(shake > 0, 'a hit must shake the screen');
  // 0.75s: long enough for the shake to decay, short enough that the one
  // second of invulnerability hasn't lapsed and re-triggered it.
  for (let i = 0; i < 45; i++) update(1 / 60);
  console.assert(shake === 0, 'shake must settle to zero, got ' + shake);

  // Sound is a no-op before the player has pressed anything, not a crash.
  console.assert(audio === null, 'no audio context before a key press');
  sound(440, 0.05);

  reset();
  console.log('checks done');
}

requestAnimationFrame(frame);
</script>
</body>
</html>
