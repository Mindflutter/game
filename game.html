<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Abyss</title>
<style>
  html, body { margin: 0; height: 100%; background: #04070d; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ---------- the arena ----------
// The game always plays out in a 1280x800 world, whatever the window size,
// so difficulty doesn't depend on your monitor. We scale that world up to
// fill the window. Any leftover margin is the same near-black as the
// background, so the letterboxing is invisible.
const ARENA_W = 1280;
const ARENA_H = 800;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let scale = 1, offX = 0, offY = 0;
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  scale = Math.min(canvas.width / ARENA_W, canvas.height / ARENA_H);
  offX = (canvas.width  - ARENA_W * scale) / 2;
  offY = (canvas.height - ARENA_H * scale) / 2;
}
window.addEventListener('resize', resize);
resize();

// ---------- input ----------
// Remember which keys are held down right now, BY PHYSICAL POSITION.
// e.code is the key itself ('KeyW'); e.key is the character that key types,
// which depends on the keyboard layout -- on a Russian layout WASD type
// ц/ф/ы/в, so matching on the character ignored them entirely. Position also
// does the right thing on AZERTY, where those four keys are labelled ZQSD.
const keys = new Set();
// Menus need to know a key *went down this frame*, not that it is held --
// otherwise holding Down flies through the list. Cleared at the end of update().
const justPressed = new Set();
window.addEventListener('keydown', e => {
  keys.add(e.code);
  if (!e.repeat) justPressed.add(e.code);     // ignore the OS key-repeat
});
window.addEventListener('keyup', e => keys.delete(e.code));

// ---------- balance ----------
// Every number that decides how the game plays, in one place. These are the
// real product of this prototype: the rendering gets rewritten on any port,
// these transfer as-is.
const PLAYER_START = {
  r: 10,             // radius, in pixels
  speed: 260,        // pixels per second
  hp: 3,
  maxHp: 3,
  fireRate: 2.5,     // shots per second
  damage: 1,
  range: 250,        // how far a shot travels before it dies
  pierce: 0,         // extra enemies a shot passes through
  pickupRange: 75,
};

const IFRAMES        = 1;     // seconds of invulnerability after a hit
const BULLET_SPEED   = 430;   // pixels per second
const GEM_PULL       = 300;   // how fast gems fly to you once in range
const GEM_LIFE       = 8;     // seconds before an uncollected gem fades out
const XP_BASE        = 5;     // motes needed for level 2
const XP_GROWTH      = 1.45;  // each level costs this much more than the last
const SPAWN_FIRST    = 1.2;   // seconds between spawns at the start of a run
const SPAWN_QUICKEN  = 0.02;  // ...shortening by this much per second survived
const SPAWN_FASTEST  = 0.15;  // ...but never below this
const ENEMY_RAMP     = 0.006; // enemies spawn this much faster-moving per second
const ENEMY_JITTER   = 0.3;   // spread of speeds around a type's nominal speed

let bulletId = 0;           // so a piercing shot can't hit the same enemy twice

// ---------- settings ----------
const SHAKE_LEVELS = [
  { name: 'off',    mul: 0 },
  { name: 'low',    mul: 0.5 },
  { name: 'normal', mul: 1 },
];
// Shake eases out exponentially: a hard linear stop reads as the picture
// being switched off, an exponential tail reads as the water settling.
const SHAKE_FADE  = 0.02;   // fraction of the shake still left after one second
const SHAKE_FLOOR = 0.15;   // below a fifth of a pixel, snap to a still picture
const SHAKE_HURT  = 7;      // px, taking a hit
const SHAKE_DEATH = 38;     // px, dying -- a real slam, it only happens once

let volume = 0.6;           // master gain, 0..1
let shakeLevel = 2;         // index into SHAKE_LEVELS
let showFps = false;

// ---------- sound ----------
// Every sound is an oscillator and a fading volume envelope. No audio files.
// `vol` is peak amplitude, 0..1. Anything under about 0.15 is inaudible on
// laptop speakers for a short blip -- the ?test checks hold us to that.
const SOUNDS = {
  shoot:  { freq: 680,  dur: 0.05, type: 'square',   vol: 0.20, slide: 0.55 },
  kill:   { freq: 200,  dur: 0.11, type: 'sawtooth', vol: 0.32, slide: 0.45 },
  gem:    { freq: 1150, dur: 0.05, type: 'sine',     vol: 0.22, slide: 1.3  },
  hurt:   { freq: 110,  dur: 0.28, type: 'sawtooth', vol: 0.55, slide: 0.4  },
  death:  { freq: 70,   dur: 0.90, type: 'sawtooth', vol: 0.60, slide: 0.3  },
  levelA: { freq: 520,  dur: 0.09, type: 'triangle', vol: 0.40, slide: 1    },
  levelB: { freq: 780,  dur: 0.16, type: 'triangle', vol: 0.35, slide: 1.25 },
};

let audio = null;
let master = null;
let muted = false;

// One voice: an oscillator through its own volume envelope. Takes the context
// as an argument so the checks can render it offline and measure how loud it is.
function voice(ac, dest, s, t, pitch = 1) {
  const freq = s.freq * pitch;
  const osc = ac.createOscillator();
  const gain = ac.createGain();
  osc.type = s.type;
  osc.frequency.setValueAtTime(freq, t);
  if (s.slide !== 1) {
    osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq * s.slide), t + s.dur);
  }
  gain.gain.setValueAtTime(s.vol, t);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + s.dur);   // never ramp to 0
  osc.connect(gain).connect(dest);
  osc.start(t);
  osc.stop(t + s.dur);
}

// Browsers refuse to make noise before the user interacts, so the context is
// built on the first key press -- and resumed on later ones, because some
// browsers hand back a suspended context anyway.
window.addEventListener('keydown', e => {
  if (!audio) {
    audio = new (window.AudioContext || window.webkitAudioContext)();
    // A dozen enemies dying at once would sum past 1.0 and clip; the
    // compressor rides that down instead of letting it crackle.
    const comp = audio.createDynamicsCompressor();
    master = audio.createGain();
    master.gain.value = volume;
    master.connect(comp).connect(audio.destination);
  } else if (audio.state === 'suspended') {
    audio.resume();
  }
  if (e.code === 'KeyM') muted = !muted;
});

function sound(name, pitch = 1) {
  if (!audio || muted) return;
  voice(audio, master, SOUNDS[name], audio.currentTime, pitch);
}

// ---------- upgrades ----------
// Just data. Adding one is a new line here and nothing else.
const UPGRADES = [
  { name: 'Rapid Fire', desc: '+35% fire rate',        apply: p => p.fireRate *= 1.35 },
  { name: 'Power',      desc: '+1 damage',             apply: p => p.damage += 1 },
  { name: 'Reach',      desc: '+70 firing range',      apply: p => p.range += 70 },
  { name: 'Fins',       desc: '+45 move speed',        apply: p => p.speed += 45 },
  { name: 'Pierce',     desc: 'shots pass through +1', apply: p => p.pierce += 1 },
  { name: 'Lure',       desc: '+45 pickup range',      apply: p => p.pickupRange += 45 },
  { name: 'Vitality',   desc: '+1 max HP, heal 1',     apply: p => { p.maxHp += 1; p.hp += 1; } },
];

function rollUpgrades() {
  const pool = UPGRADES.slice();       // a copy, so we don't wreck the original
  const out = [];
  while (out.length < 3 && pool.length) {
    out.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  }
  return out;
}

// ---------- enemy types ----------
// Also just data. Each one unlocks partway into a run and is picked by weight,
// so the swarm gets more varied the longer you last.
const ENEMY_TYPES = [
  { name: 'drifter', r: 9,  hp: 1, speed: 85,  xp: 1, weight: 6, from: 0,
    color: '#e8446e', glow: '#ff1e5a' },
  { name: 'darter',  r: 6,  hp: 1, speed: 190, xp: 1, weight: 3, from: 25,
    color: '#ffb648', glow: '#ff8a00' },
  { name: 'bulwark', r: 17, hp: 6, speed: 52,  xp: 3, weight: 2, from: 50,
    color: '#a05cff', glow: '#7b2fff' },
];

function pickEnemyType() {
  const open = ENEMY_TYPES.filter(t => elapsed >= t.from);
  const total = open.reduce((sum, t) => sum + t.weight, 0);
  let r = Math.random() * total;
  for (const t of open) { r -= t.weight; if (r <= 0) return t; }
  return open[0];
}

// ---------- game state ----------
// Everything a run owns lives here, so restarting is one call.
let player, enemies, bullets, gems, particles;
let elapsed, spawnTimer, kills, shake;
let xp, xpNext, level, choices;

// Which screen we're on. Replaces the old `paused` and `dead` flags, which
// could contradict each other; now there is exactly one answer at a time.
// 'title' | 'playing' | 'levelup' | 'paused' | 'help' | 'options' | 'dead'
let screen = 'title';
let menuIndex = 0;          // cursor in the title / pause menu
let optionIndex = 0;        // cursor in the options list
let returnTo = 'title';     // where Esc goes back to from help / options

function reset() {
  player = {
    ...PLAYER_START,
    x: ARENA_W / 2,
    y: ARENA_H / 2,
    hurt: 0,           // seconds of invulnerability left
    fireTimer: 0,      // seconds until the next shot
  };
  enemies = [];
  bullets = [];
  gems = [];
  particles = [];
  elapsed = 0;         // seconds survived
  spawnTimer = 0;
  kills = 0;
  shake = 0;           // pixels of screen shake left
  screen = 'playing';  // a reset run is a running run

  xp = 0;
  xpNext = XP_BASE;
  level = 1;
  choices = [];
}

// ---------- menus ----------
// Same trick as upgrades and enemy types: a list of entries, so adding one
// is a line and nothing else changes.
const MENUS = {
  title: {
    heading: 'ABYSS',
    sub: 'something small, in very deep water',
    items: [
      { label: 'Start',   run: () => reset() },          // reset() starts the run
      { label: 'Help',    run: () => openScreen('help') },
      { label: 'Options', run: () => openScreen('options') },
    ],
  },
  paused: {
    heading: 'PAUSED',
    sub: '',
    items: [
      { label: 'Resume',        run: () => { screen = 'playing'; } },
      { label: 'Help',          run: () => openScreen('help') },
      { label: 'Options',       run: () => openScreen('options') },
      { label: 'Quit to title', run: () => { screen = 'title'; menuIndex = 0; } },
    ],
  },
};

const OPTIONS = [
  { label: 'Volume',
    show: () => Math.round(volume * 100) + '%',
    change: d => {
      volume = Math.max(0, Math.min(1, Math.round((volume + d * 0.1) * 10) / 10));
      if (master) master.gain.value = volume;
      sound('gem');                       // so you hear what you just set
    } },
  { label: 'Screen shake',
    show: () => SHAKE_LEVELS[shakeLevel].name,
    change: d => {
      shakeLevel = Math.max(0, Math.min(SHAKE_LEVELS.length - 1, shakeLevel + d));
    } },
  { label: 'Show FPS',
    show: () => (showFps ? 'on' : 'off'),
    change: () => { showFps = !showFps; } },
];

const HELP_KEYS = [
  ['Move',           'W A S D   or   arrow keys'],
  ['Choose upgrade', '1   2   3'],
  ['Restart a run',  'R'],
  ['Mute sound',     'M'],
  ['Menu / back',    'Esc'],
];

const HELP_BLURB = [
  'Your weapon fires by itself at whatever comes inside the ring.',
  'Things you kill drop green motes. Walk over them to gain XP.',
  'Motes fade after eight seconds, so the reward sits where the danger was.',
  'Fill the bar, take one of three upgrades, and see how long you last.',
];

function openScreen(name) {
  returnTo = screen;
  screen = name;
  optionIndex = 0;
}

// ---------- spawning ----------
function spawnEnemy() {
  const m = 40;                                  // how far outside the arena
  const edge = Math.floor(Math.random() * 4);    // 0 top, 1 right, 2 bottom, 3 left
  let x, y;
  if      (edge === 0) { x = Math.random() * ARENA_W;  y = -m; }
  else if (edge === 1) { x = ARENA_W + m;              y = Math.random() * ARENA_H; }
  else if (edge === 2) { x = Math.random() * ARENA_W;  y = ARENA_H + m; }
  else                 { x = -m;                       y = Math.random() * ARENA_H; }

  // Later arrivals swim faster, so kiting stops working on its own.
  const t = pickEnemyType();
  const speed = t.speed * (1 - ENEMY_JITTER / 2 + Math.random() * ENEMY_JITTER) *
                (1 + elapsed * ENEMY_RAMP);
  enemies.push({ x, y, r: t.r, speed, hp: t.hp, maxHp: t.hp, xp: t.xp,
                 color: t.color, glow: t.glow, lastHitBy: 0 });
}

function spark(x, y, vx, vy, life, r, color, glow) {
  particles.push({ x, y, vx, vy, life, maxLife: life, r, color, glow });
}

// A puff of shrinking sparks thrown in every direction. Purely decorative,
// but it's what makes a kill feel like an event rather than a disappearance.
function burst(x, y, color, glow, count, speed, life = 0.45) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = speed * (0.3 + Math.random() * 0.7);
    spark(x, y, Math.cos(a) * s, Math.sin(a) * s, life, 3, color, glow);
  }
}

// Sparks kicked back along the shot, so a hit that doesn't kill still looks
// like it landed.
function hitSparks(e, b) {
  const bs = Math.sqrt(b.vx * b.vx + b.vy * b.vy) || 1;
  for (let n = 0; n < 5; n++) {
    const spread = (Math.random() - 0.5) * 1.6;
    const sp = 70 + Math.random() * 90;
    spark(e.x, e.y,
          (-b.vx / bs) * sp + Math.cos(spread) * sp * 0.5,
          (-b.vy / bs) * sp + Math.sin(spread) * sp * 0.5,
          0.22, 2.5, '#ffffff', e.glow);
  }
}

// Closest enemy inside firing range, or null if nothing is close enough.
// Seeding the search with the range does both jobs at once. Compared in
// squared space -- we only need the ordering, never the distance itself.
function nearestEnemy() {
  let best = null, bestSq = player.range * player.range;
  for (const e of enemies) {
    const dx = e.x - player.x, dy = e.y - player.y;
    const sq = dx * dx + dy * dy;
    if (sq < bestSq) { bestSq = sq; best = e; }
  }
  return best;
}

function gainXp() {
  xp += 1;
  if (xp < xpNext) return;
  xp -= xpNext;
  level += 1;
  // Geometric, not linear: XP income compounds as you level, so its cost has to.
  xpNext = Math.round(XP_BASE * Math.pow(XP_GROWTH, level - 1));
  choices = rollUpgrades();
  screen = 'levelup';
  sound('levelA');
  sound('levelB');
}

// ---------- update ----------
// One wrapper so this-frame's key presses are forgotten afterwards, whichever
// way step() returned.
function update(dt) {
  step(dt);
  // Outside step(), because step() returns early on every non-playing screen.
  // Dying sets screen = 'dead' in the same frame it sets shake, so decaying
  // inside the gameplay path left the menus rattling forever.
  // Math.pow(_, dt) rather than a per-frame factor, so the fade takes the same
  // time on a 144Hz screen as on a 60Hz one.
  if (shake > 0) {
    shake *= Math.pow(SHAKE_FADE, dt);
    if (shake < SHAKE_FLOOR) shake = 0;      // otherwise it jitters forever
  }
  justPressed.clear();
}

const UP    = ['ArrowUp', 'KeyW'];
const DOWN  = ['ArrowDown', 'KeyS'];
const LEFT  = ['ArrowLeft', 'KeyA'];
const RIGHT = ['ArrowRight', 'KeyD'];
const GO    = ['Enter', 'NumpadEnter', 'Space'];
const tapped = codes => codes.some(c => justPressed.has(c));

function moveCursor(index, length) {
  if (tapped(UP))   return (index + length - 1) % length;
  if (tapped(DOWN)) return (index + 1) % length;
  return index;
}

function step(dt) {
  if (screen === 'title' || screen === 'paused') {
    const items = MENUS[screen].items;
    menuIndex = moveCursor(menuIndex, items.length);
    if (tapped(GO)) items[menuIndex].run();
    else if (justPressed.has('Escape') && screen === 'paused') screen = 'playing';
    return;
  }

  if (screen === 'help') {
    if (justPressed.has('Escape') || tapped(GO)) screen = returnTo;
    return;
  }

  if (screen === 'options') {
    optionIndex = moveCursor(optionIndex, OPTIONS.length);
    if (tapped(LEFT))  OPTIONS[optionIndex].change(-1);
    if (tapped(RIGHT) || tapped(GO)) OPTIONS[optionIndex].change(1);
    if (justPressed.has('Escape')) screen = returnTo;
    return;
  }

  if (screen === 'dead') {
    if (justPressed.has('KeyR')) reset();
    if (justPressed.has('Escape')) { screen = 'title'; menuIndex = 0; }
    return;
  }

  // Picking an upgrade. The whole game is frozen until you choose.
  if (screen === 'levelup') {
    for (let i = 0; i < choices.length; i++) {
      const n = String(i + 1);
      if (justPressed.has('Digit' + n) || justPressed.has('Numpad' + n)) {
        choices[i].apply(player);
        choices = [];
        screen = 'playing';
        break;
      }
    }
    return;
  }

  if (justPressed.has('Escape')) { screen = 'paused'; menuIndex = 0; return; }

  elapsed += dt;
  if (player.hurt > 0) player.hurt -= dt;

  // --- move the player ---
  let dx = 0, dy = 0;
  if (keys.has('KeyA') || keys.has('ArrowLeft'))  dx -= 1;
  if (keys.has('KeyD') || keys.has('ArrowRight')) dx += 1;
  if (keys.has('KeyW') || keys.has('ArrowUp'))    dy -= 1;
  if (keys.has('KeyS') || keys.has('ArrowDown'))  dy += 1;

  // Holding two keys would otherwise move you 1.41x faster diagonally.
  const len = Math.hypot(dx, dy);
  if (len > 0) { dx /= len; dy /= len; }

  player.x += dx * player.speed * dt;
  player.y += dy * player.speed * dt;
  player.x = Math.max(player.r, Math.min(ARENA_W - player.r, player.x));
  player.y = Math.max(player.r, Math.min(ARENA_H - player.r, player.y));

  // --- spawn new enemies, faster as time goes on ---
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnEnemy();
    spawnTimer = Math.max(SPAWN_FASTEST, SPAWN_FIRST - elapsed * SPAWN_QUICKEN);
  }

  // --- the weapon fires itself at whoever is closest, if anyone is in range ---
  player.fireTimer -= dt;
  if (player.fireTimer <= 0) {
    const target = nearestEnemy();
    if (target) {                      // nothing in range? hold the shot
      const tx = target.x - player.x;
      const ty = target.y - player.y;
      const d = Math.hypot(tx, ty) || 1;
      bullets.push({
        id: ++bulletId,
        x: player.x, y: player.y, r: 4,
        vx: (tx / d) * BULLET_SPEED,
        vy: (ty / d) * BULLET_SPEED,
        pierce: player.pierce,
        travelled: 0,
        maxTravel: player.range,       // the ring means what it says
      });
      player.fireTimer = 1 / player.fireRate;
      sound('shoot');
    }
  }

  // --- move enemies toward the player, and hurt him on contact ---
  for (const e of enemies) {
    const ex = player.x - e.x;
    const ey = player.y - e.y;
    const d = Math.sqrt(ex * ex + ey * ey) || 1;   // || 1 avoids dividing by zero

    e.x += (ex / d) * e.speed * dt;
    e.y += (ey / d) * e.speed * dt;

    if (d < e.r + player.r && player.hurt <= 0) {
      player.hp -= 1;
      player.hurt = IFRAMES;
      shake = SHAKE_HURT * SHAKE_LEVELS[shakeLevel].mul;
      burst(player.x, player.y, '#bffcff', '#4ff0ff', 16, 190, 0.5);
      sound('hurt');
      if (player.hp <= 0) {
        screen = 'dead';
        shake = SHAKE_DEATH * SHAKE_LEVELS[shakeLevel].mul;
        sound('death');
      }
    }
  }

  // --- move bullets; they die at the edge of your range ---
  for (const b of bullets) {
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.travelled += BULLET_SPEED * dt;
    if (b.travelled >= b.maxTravel) b.gone = true;
  }

  // --- bullets vs enemies ---
  // ponytail: every bullet against every enemy. Fine to a few hundred of each;
  // if it ever chugs, bucket entities into a grid and only compare neighbours.
  for (const b of bullets) {
    if (b.gone) continue;
    for (const e of enemies) {
      if (e.gone) continue;
      // Squared compare: a < b is the same question as a*a < b*b for lengths,
      // and skipping the square root here is 8x faster in the one loop that
      // runs bullets x enemies times every frame.
      const dx = e.x - b.x, dy = e.y - b.y, reach = e.r + b.r;
      if (dx * dx + dy * dy < reach * reach) {
        if (e.lastHitBy === b.id) continue;   // a shot hits each enemy at most once
        e.lastHitBy = b.id;
        e.hp -= player.damage;
        e.flash = 0.07;                       // a white frame or two on impact
        hitSparks(e, b);
        if (e.hp <= 0) {
          e.gone = true;
          kills += 1;
          for (let n = 0; n < e.xp; n++) {
            gems.push({ x: e.x + (Math.random() - 0.5) * 18,
                        y: e.y + (Math.random() - 0.5) * 18, r: 4, life: GEM_LIFE });
          }
          burst(e.x, e.y, e.color, e.glow, 12 + e.maxHp * 2, 170 + e.maxHp * 14, 0.5);
          sound('kill', 1 - Math.min(0.4, e.maxHp * 0.04));  // bigger things pop lower
        }
        if (b.pierce > 0) { b.pierce -= 1; }
        else { b.gone = true; break; }
      }
    }
  }

  // --- gems drift to you when close, fade out if you never come ---
  for (const g of gems) {
    g.life -= dt;
    if (g.life <= 0) { g.gone = true; continue; }

    const gx = player.x - g.x;
    const gy = player.y - g.y;
    const d = Math.sqrt(gx * gx + gy * gy) || 1;

    if (d < player.pickupRange) {
      g.x += (gx / d) * GEM_PULL * dt;
      g.y += (gy / d) * GEM_PULL * dt;
    }
    if (d < player.r + g.r + 4) {
      g.gone = true;
      sound('gem');
      gainXp();
    }
  }

  // --- sparks fly out, slow down and fade ---
  // Drag has to be per second, not per frame: `vx *= 0.92` every frame would
  // slow sparks 2.4x faster on a 144Hz screen than on a 60Hz one.
  const drag = Math.pow(0.06, dt);      // down to 6% of speed each second
  for (const p of particles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= drag;
    p.vy *= drag;
    p.life -= dt;
  }

  for (const e of enemies) if (e.flash > 0) e.flash -= dt;

  // Sweep up everything marked during this frame. Never remove things from
  // an array while you are still looping over it.
  enemies = enemies.filter(e => !e.gone);
  bullets = bullets.filter(b => !b.gone);
  gems    = gems.filter(g => !g.gone);
  particles = particles.filter(p => p.life > 0);
}

// ---------- draw: paint one frame ----------
function circle(x, y, r, fill, glow, blur = 20) {
  ctx.shadowBlur = blur;
  ctx.shadowColor = glow;
  ctx.fillStyle = fill;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
}

function drawUpgradeCards() {
  dimArena();

  ctx.textAlign = 'center';
  ctx.fillStyle = '#9ef7ff';
  ctx.font = '30px system-ui, sans-serif';
  ctx.fillText('LEVEL UP', ARENA_W / 2, ARENA_H / 2 - 130);

  const w = 220, h = 140, gap = 24;
  const totalW = choices.length * w + (choices.length - 1) * gap;
  const left = ARENA_W / 2 - totalW / 2;
  const top  = ARENA_H / 2 - h / 2;

  choices.forEach((u, i) => {
    const x = left + i * (w + gap);
    ctx.fillStyle = 'rgba(16, 44, 58, 0.92)';
    ctx.fillRect(x, top, w, h);
    ctx.strokeStyle = '#2b6b7d';
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, top + 0.5, w - 1, h - 1);

    ctx.fillStyle = '#bffcff';
    ctx.font = '19px system-ui, sans-serif';
    ctx.fillText(u.name, x + w / 2, top + 48);

    ctx.fillStyle = '#7fb0c0';
    ctx.font = '13px system-ui, sans-serif';
    ctx.fillText(u.desc, x + w / 2, top + 78);

    ctx.fillStyle = '#4ff0ff';
    ctx.font = '16px system-ui, sans-serif';
    ctx.fillText('[ ' + (i + 1) + ' ]', x + w / 2, top + 114);
  });
}

// So a silent game can tell you why it is silent.
function audioStatus() {
  if (muted) return '   [M] muted';
  if (!audio) return '   sound: press a key';
  if (audio.state !== 'running') return '   sound: ' + audio.state;
  return '';
}

function dimArena(alpha = 0.82) {
  ctx.fillStyle = 'rgba(4, 7, 13, ' + alpha + ')';
  ctx.fillRect(0, 0, ARENA_W, ARENA_H);
}

// The play field. draw() has already set up arena coordinates and the shake.
function drawField() {
  // How far your shots reach — the player needs to see this.
  ctx.strokeStyle = 'rgba(79, 240, 255, 0.10)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.range, 0, Math.PI * 2);
  ctx.stroke();

  // Gems blink for their last two seconds, then they're gone.
  for (const g of gems) {
    if (g.life < 2 && Math.floor(g.life * 8) % 2 === 0) continue;
    circle(g.x, g.y, g.r, '#a8ffd8', '#2affb0', 14);
  }

  // A wounded enemy shrinks, so you can see a big one is nearly finished,
  // and flashes white for a frame or two when hit.
  for (const e of enemies) {
    const hit = e.flash > 0;
    circle(e.x, e.y, e.r * (0.7 + 0.3 * e.hp / e.maxHp),
           hit ? '#ffffff' : e.color, hit ? '#ffffff' : e.glow, 18);
  }

  // Sparks shrink as they die.
  for (const p of particles) {
    circle(p.x, p.y, p.r * (p.life / p.maxLife), p.color, p.glow, 10);
  }

  // Bullets are streaks, not dots — so they don't read as gems, and so you
  // can see which way they're going.
  ctx.shadowBlur = 12;
  ctx.shadowColor = '#9ef7ff';
  ctx.strokeStyle = '#eaffff';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  for (const b of bullets) {
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x - b.vx * 0.035, b.y - b.vy * 0.035);
    ctx.stroke();
  }
  ctx.shadowBlur = 0;

  // Blink while invulnerable, so getting hit is visible.
  const blinking = player.hurt > 0 && Math.floor(player.hurt * 10) % 2 === 0;
  if (!blinking) circle(player.x, player.y, player.r, '#bffcff', '#4ff0ff', 25);

  // --- XP bar across the very top ---
  ctx.fillStyle = '#12303a';
  ctx.fillRect(0, 0, ARENA_W, 5);
  ctx.fillStyle = '#4ff0ff';
  ctx.fillRect(0, 0, ARENA_W * (xp / xpNext), 5);

  // --- HUD ---
  ctx.fillStyle = '#7fb0c0';
  ctx.font = '14px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('HP ' + player.hp + '/' + player.maxHp + '   LV ' + level +
               '   ' + elapsed.toFixed(1) + 's   ' + kills + ' killed' +
               audioStatus(), 16, 30);

  if (showFps) {
    ctx.fillStyle = '#3d6270';
    ctx.fillText('fps ' + Math.round(fps) + '    enemies ' + enemies.length +
                 '   shots ' + bullets.length + '   motes ' + gems.length +
                 '   sparks ' + particles.length, 16, 50);
  }
}

function drawDeath() {
  dimArena(0.75);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ff5c85';
  ctx.font = '44px system-ui, sans-serif';
  ctx.fillText('CONSUMED', ARENA_W / 2, ARENA_H / 2 - 10);

  ctx.fillStyle = '#7fb0c0';
  ctx.font = '16px system-ui, sans-serif';
  ctx.fillText('level ' + level + ', survived ' + elapsed.toFixed(1) + 's, killed ' +
               kills, ARENA_W / 2, ARENA_H / 2 + 26);

  ctx.fillStyle = '#2f5563';
  ctx.font = '13px system-ui, sans-serif';
  ctx.fillText('R to go again,  Esc for the menu', ARENA_W / 2, ARENA_H / 2 + 60);
}

function drawHint(text) {
  ctx.textAlign = 'center';
  ctx.fillStyle = '#2f5563';
  ctx.font = '13px system-ui, sans-serif';
  ctx.fillText(text, ARENA_W / 2, ARENA_H - 64);
}

function drawMenu(menu) {
  ctx.textAlign = 'center';
  ctx.shadowBlur = 28;
  ctx.shadowColor = '#4ff0ff';
  ctx.fillStyle = '#bffcff';
  ctx.font = '58px system-ui, sans-serif';
  ctx.fillText(menu.heading, ARENA_W / 2, 240);
  ctx.shadowBlur = 0;

  if (menu.sub) {
    ctx.fillStyle = '#456b78';
    ctx.font = '15px system-ui, sans-serif';
    ctx.fillText(menu.sub, ARENA_W / 2, 276);
  }

  menu.items.forEach((item, i) => {
    const on = i === menuIndex;
    ctx.fillStyle = on ? '#bffcff' : '#547f8d';
    ctx.font = (on ? '23px' : '20px') + ' system-ui, sans-serif';
    ctx.fillText(on ? '\u203a  ' + item.label + '  \u2039' : item.label,
                 ARENA_W / 2, 380 + i * 46);
  });

  drawHint('\u2191 \u2193 to choose,  Enter to pick');
}

function drawHelp() {
  ctx.textAlign = 'center';
  ctx.fillStyle = '#9ef7ff';
  ctx.font = '34px system-ui, sans-serif';
  ctx.fillText('HELP', ARENA_W / 2, 150);

  ctx.font = '16px system-ui, sans-serif';
  HELP_KEYS.forEach(([what, key], i) => {
    const y = 232 + i * 34;
    ctx.textAlign = 'right';
    ctx.fillStyle = '#547f8d';
    ctx.fillText(what, ARENA_W / 2 - 24, y);
    ctx.textAlign = 'left';
    ctx.fillStyle = '#bffcff';
    ctx.fillText(key, ARENA_W / 2 + 24, y);
  });

  ctx.textAlign = 'center';
  ctx.fillStyle = '#6f97a5';
  ctx.font = '15px system-ui, sans-serif';
  HELP_BLURB.forEach((line, i) => ctx.fillText(line, ARENA_W / 2, 470 + i * 27));

  drawHint('Esc to go back');
}

function drawOptions() {
  ctx.textAlign = 'center';
  ctx.fillStyle = '#9ef7ff';
  ctx.font = '34px system-ui, sans-serif';
  ctx.fillText('OPTIONS', ARENA_W / 2, 190);

  OPTIONS.forEach((opt, i) => {
    const on = i === optionIndex;
    const y = 300 + i * 46;
    ctx.font = (on ? '20px' : '18px') + ' system-ui, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillStyle = on ? '#bffcff' : '#547f8d';
    ctx.fillText(opt.label, ARENA_W / 2 - 24, y);
    ctx.textAlign = 'left';
    ctx.fillStyle = on ? '#4ff0ff' : '#3d6270';
    ctx.fillText(on ? '\u2039 ' + opt.show() + ' \u203a' : opt.show(),
                 ARENA_W / 2 + 24, y);
  });

  drawHint('\u2191 \u2193 to choose,  \u2190 \u2192 to change,  Esc to go back');
}

function draw() {
  // Paint the whole window, including the letterbox margin, then switch
  // into arena coordinates and clip so nothing spills into the margin.
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#04070d';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.setTransform(scale, 0, 0, scale, offX, offY);
  ctx.beginPath();
  ctx.rect(0, 0, ARENA_W, ARENA_H);
  ctx.clip();

  // Shake the contents, not the clip window, so the arena edge stays put.
  if (shake > 0) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  }

  if (screen === 'title')        drawMenu(MENUS.title);
  else if (screen === 'help')    drawHelp();
  else if (screen === 'options') drawOptions();
  else {
    drawField();
    if (screen === 'levelup')     drawUpgradeCards();
    else if (screen === 'paused') { dimArena(); drawMenu(MENUS.paused); }
    else if (screen === 'dead')   drawDeath();
  }

  ctx.restore();
}

// ---------- the loop ----------
let last = performance.now();
let fps = 60;
function frame(now) {
  // Seconds since the previous frame. Capped, so that switching tabs
  // for a minute doesn't teleport everything across the screen.
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  if (dt > 0) fps += (1 / dt - fps) * 0.1;    // smoothed, or it's unreadable

  update(dt);
  draw();
  requestAnimationFrame(frame);
}

reset();
screen = 'title';       // reset() leaves us playing; the game opens on the menu

// ---------- checks: open game.html?test and look at the console ----------
if (location.search === '?test') {
  const mob = (x, y, over) => Object.assign(
    { x, y, r: 9, speed: 0, hp: 1, maxHp: 1, xp: 1, lastHitBy: 0 }, over);

  for (let i = 0; i < 300; i++) spawnEnemy();
  console.assert(
    enemies.every(e => e.x < 0 || e.x > ARENA_W || e.y < 0 || e.y > ARENA_H),
    'enemies must spawn outside the arena');
  console.assert(
    new Set(enemies.map(e => e.speed)).size > 1,
    'enemies should not all move at the same speed');

  // Enemy types unlock as the run goes on.
  reset();
  elapsed = 0;
  console.assert(
    new Set(Array.from({ length: 50 }, () => pickEnemyType().name)).size === 1,
    'only drifters at the start of a run');
  elapsed = 60;
  const seen = new Set(Array.from({ length: 400 }, () => pickEnemyType().name));
  console.assert(seen.size === ENEMY_TYPES.length,
    'every type should appear later, saw: ' + [...seen].join(','));

  // Walking an enemy into a standing player must cost exactly one hp.
  reset();
  enemies.push(mob(player.x + 200, player.y, { speed: 100, hp: 999, maxHp: 999 }));
  for (let i = 0; i < 150; i++) update(0.016);   // 2.4s: touches once, not twice
  console.assert(player.hp === 2, 'one touch = one hp, got ' + player.hp);

  // The weapon ignores anything beyond its range, and targets the closest.
  reset();
  enemies.push(mob(player.x + player.range + 60, player.y));
  console.assert(nearestEnemy() === null, 'must not target beyond range');
  const close = mob(player.x + 40, player.y);
  enemies.push(close);
  console.assert(nearestEnemy() === close, 'must target the closest enemy in range');

  // A shot dies once it has flown its range, rather than crossing the arena.
  reset();
  bullets.push({ id: ++bulletId, x: 100, y: 400, r: 4, vx: BULLET_SPEED, vy: 0,
                 pierce: 0, travelled: 0, maxTravel: 200 });
  for (let i = 0; i < 40; i++) update(1 / 60);   // long enough to fly 280px
  console.assert(bullets.length === 0, 'shots must expire at the edge of their range');

  // A piercing shot passes through, but only damages each enemy once.
  reset();
  const tank = mob(player.x + 100, player.y, { hp: 3, maxHp: 3 });
  enemies.push(tank);
  player.fireTimer = 999;                        // silence the auto-weapon
  bullets.push({ id: ++bulletId, x: player.x, y: player.y, r: 4,
                 vx: BULLET_SPEED, vy: 0, pierce: 2, travelled: 0, maxTravel: 300 });
  for (let i = 0; i < 30; i++) update(1 / 60);
  console.assert(tank.hp === 2, 'a piercing shot must hit once, hp=' + tank.hp);

  // A tough enemy survives a hit that would kill a drifter.
  reset();
  const big = mob(player.x + 120, player.y, { hp: 6, maxHp: 6, xp: 3 });
  enemies.push(big);
  for (let i = 0; i < 45; i++) update(1 / 60);
  console.assert(big.hp < 6 && kills === 0, 'a bulwark must not die to one shot');

  // Shooting a drifter kills it and drops a gem.
  reset();
  enemies.push(mob(player.x + 150, player.y));
  for (let i = 0; i < 60; i++) update(0.016);    // ~1s
  console.assert(kills === 1, 'expected one kill, got ' + kills);
  console.assert(gems.length === 1, 'a kill must drop a gem');

  // A tougher enemy is worth more gems. Keep it outside pickupRange, or the
  // gems get vacuumed up the moment they drop and there is nothing to count.
  reset();
  enemies.push(mob(player.x + 150, player.y, { hp: 1, maxHp: 6, xp: 3 }));
  for (let i = 0; i < 60; i++) update(0.016);
  console.assert(gems.length === 3, 'xp 3 must drop 3 gems, got ' + gems.length);

  // An ignored gem fades out instead of littering the floor forever.
  reset();
  gems.push({ x: 40, y: 40, r: 4, life: 0.5 });
  for (let i = 0; i < 60; i++) update(1 / 60);
  console.assert(gems.length === 0, 'uncollected gems must expire');

  // Levelling costs more each time, rather than less.
  const costs = [];
  for (let lv = 1; lv <= 6; lv++) costs.push(Math.round(5 * Math.pow(XP_GROWTH, lv - 1)));
  console.assert(costs.every((c, i) => i === 0 || c > costs[i - 1]),
    'xp cost must rise every level: ' + costs.join(','));

  // Collecting the last gem you need levels you up and pauses the game.
  reset();
  xp = xpNext - 1;
  gems.push({ x: player.x, y: player.y, r: 4, life: GEM_LIFE });
  update(0.016);
  console.assert(level === 2 && screen === 'levelup', 'last gem must level you up and pause');
  console.assert(choices.length === 3, 'a level-up offers 3 choices');
  console.assert(new Set(choices).size === 3, 'the 3 choices must be different');

  // Pressing its number applies the upgrade and resumes play.
  const before = player.speed;
  choices = [UPGRADES.find(u => u.name === 'Fins')];
  justPressed.add('Digit1');
  update(0.016);
  console.assert(screen === 'playing' && player.speed > before,
    'picking must apply the upgrade and resume');

  // Sparks appear on a kill, then clean themselves up.
  reset();
  burst(100, 100, '#fff', '#fff', 8, 150, 0.2);
  console.assert(particles.length === 8, 'burst must make 8 sparks');
  for (let i = 0; i < 30; i++) update(1 / 60);   // 0.5s, well past their 0.2s life
  console.assert(particles.length === 0, 'sparks must expire, left ' + particles.length);

  // Spark drag must be per second, not per frame: half a second of flight
  // has to land in the same place at 60fps and at 144fps.
  reset();
  particles.push({ x: 0, y: 0, vx: 200, vy: 0, life: 9, maxLife: 9, r: 3, color: '#fff', glow: '#fff' });
  for (let i = 0; i < 30; i++) update(1 / 60);
  const at60 = particles[0].x;
  reset();
  particles.push({ x: 0, y: 0, vx: 200, vy: 0, life: 9, maxLife: 9, r: 3, color: '#fff', glow: '#fff' });
  for (let i = 0; i < 72; i++) update(1 / 144);
  const at144 = particles[0].x;
  console.assert(Math.abs(at60 - at144) < 1,
    'spark drag must not depend on frame rate: ' + at60.toFixed(2) + ' vs ' + at144.toFixed(2));

  // A hit that doesn't kill must still throw sparks, or damage looks like
  // nothing happened.
  reset();
  const tough = mob(player.x + 90, player.y, { hp: 9, maxHp: 9, xp: 1 });
  enemies.push(tough);
  for (let i = 0; i < 40; i++) update(1 / 60);
  console.assert(tough.hp < 9 && kills === 0, 'setup: it should be hurt but alive');
  console.assert(particles.length > 0, 'a non-lethal hit must throw sparks');

  // Getting hit shakes the screen, and the shake settles back to nothing.
  reset();
  // 15px apart: closer than the radii add up to (9 + 10), so they touch.
  enemies.push(mob(player.x + 15, player.y, { speed: 0, hp: 999, maxHp: 999 }));
  update(1 / 60);
  console.assert(shake > 0, 'a hit must shake the screen');

  // It must ease out, not stop dead: still moving a quarter second later, but
  // well under half of what it started at.
  const hitPeak = shake;
  for (let i = 0; i < 15; i++) update(1 / 60);
  console.assert(shake > 0 && shake < hitPeak * 0.5,
    'shake must ease out, not cut off: ' + hitPeak.toFixed(2) + ' -> ' + shake.toFixed(2));

  enemies.length = 0;            // or it hits again once invulnerability lapses
  for (let i = 0; i < 150; i++) update(1 / 60);
  console.assert(shake === 0, 'shake must reach a still picture, got ' + shake);

  // The fade must take the same time whatever the frame rate.
  reset(); shake = 10;
  for (let i = 0; i < 60; i++) update(1 / 60);
  const fade60 = shake;
  reset(); shake = 10;
  for (let i = 0; i < 144; i++) update(1 / 144);
  console.assert(Math.abs(fade60 - shake) < 0.01,
    'shake fade must not depend on frame rate: ' + fade60 + ' vs ' + shake);

  // Sound is a no-op before the player has pressed anything, not a crash.
  console.assert(audio === null, 'no audio context before a key press');
  sound('shoot');

  // Every binding must work on a non-Latin keyboard. These dispatch real
  // events with the character a Russian (or AZERTY) layout actually produces,
  // while the physical key stays the same.
  reset();
  keys.clear();
  window.dispatchEvent(new KeyboardEvent('keydown', { key: 'ц', code: 'KeyW' }));
  console.assert(keys.has('KeyW'), 'a Russian-layout W must register');
  const yBefore = player.y;
  update(0.1);
  console.assert(player.y < yBefore, 'a Russian-layout W must move the player up');
  window.dispatchEvent(new KeyboardEvent('keyup', { key: 'ц', code: 'KeyW' }));
  console.assert(!keys.has('KeyW'), 'releasing it must stop the player');

  reset();
  screen = 'dead';
  window.dispatchEvent(new KeyboardEvent('keydown', { key: 'к', code: 'KeyR' }));
  update(1 / 60);
  console.assert(screen === 'playing', 'a Russian-layout R must restart the game');
  window.dispatchEvent(new KeyboardEvent('keyup', { key: 'к', code: 'KeyR' }));

  reset();
  screen = 'levelup';
  choices = [UPGRADES.find(u => u.name === 'Fins')];
  const speedBefore = player.speed;
  // '&' is what an unshifted 1 types on a French AZERTY keyboard.
  window.dispatchEvent(new KeyboardEvent('keydown', { key: '&', code: 'Digit1' }));
  update(1 / 60);
  console.assert(screen === 'playing' && player.speed > speedBefore,
    'an AZERTY-layout 1 must pick the first upgrade');
  window.dispatchEvent(new KeyboardEvent('keyup', { key: '&', code: 'Digit1' }));
  keys.clear();

  // --- screens, menus and options ---
  // tap() presses a key for exactly one frame, the way a real press arrives.
  const tap = code => { justPressed.add(code); update(1 / 60); };

  reset();
  screen = 'title'; menuIndex = 0;
  console.assert(MENUS.title.items[0].label === 'Start', 'first title entry is Start');
  tap('Enter');
  console.assert(screen === 'playing', 'Start must begin a run, got ' + screen);

  tap('Escape');
  console.assert(screen === 'paused', 'Esc in play must open the menu, got ' + screen);
  tap('Escape');
  console.assert(screen === 'playing', 'Esc again must resume, got ' + screen);

  // Help must come back to wherever it was opened from, not always the title.
  screen = 'title'; menuIndex = 1;
  tap('Enter');
  console.assert(screen === 'help', 'title -> help, got ' + screen);
  tap('Escape');
  console.assert(screen === 'title', 'help must return to the title, got ' + screen);

  screen = 'paused'; menuIndex = 1;
  tap('Enter');
  console.assert(screen === 'help', 'pause -> help, got ' + screen);
  tap('Escape');
  console.assert(screen === 'paused', 'help must return to the pause menu, got ' + screen);

  // The cursor wraps at both ends.
  screen = 'title'; menuIndex = 0;
  tap('ArrowUp');
  console.assert(menuIndex === MENUS.title.items.length - 1, 'cursor wraps upward');
  tap('ArrowDown');
  console.assert(menuIndex === 0, 'cursor wraps back down');

  // Holding a key must not scroll the menu: a repeat is not a fresh press.
  screen = 'title'; menuIndex = 0;
  window.dispatchEvent(new KeyboardEvent('keydown', { code: 'ArrowDown', repeat: true }));
  update(1 / 60);
  console.assert(menuIndex === 0, 'key auto-repeat must not move the cursor');

  // Each option changes the thing it claims to.
  screen = 'options'; optionIndex = 0; volume = 0.6;
  tap('ArrowLeft');
  console.assert(Math.abs(volume - 0.5) < 1e-9, 'volume must go down, got ' + volume);
  tap('ArrowRight'); tap('ArrowRight');
  console.assert(Math.abs(volume - 0.7) < 1e-9, 'volume must go up, got ' + volume);
  volume = 0.6;

  screen = 'options'; optionIndex = 1; shakeLevel = 2;
  tap('ArrowLeft');
  console.assert(SHAKE_LEVELS[shakeLevel].name === 'low', 'shake must step down');

  screen = 'options'; optionIndex = 2; showFps = false;
  tap('Enter');
  console.assert(showFps === true, 'fps readout must toggle on');
  tap('Enter');
  console.assert(showFps === false, 'fps readout must toggle off');

  // Dying shakes the screen, and that shake must settle even though the game
  // has stopped updating. The check above never died, so it missed this.
  reset();
  player.hp = 1;
  enemies.push(mob(player.x + 15, player.y, { speed: 0, hp: 999, maxHp: 999 }));
  update(1 / 60);
  console.assert(screen === 'dead', 'setup: that should have killed the player');
  console.assert(shake > 0, 'dying must shake the screen');
  for (let i = 0; i < 150; i++) update(1 / 60);
  console.assert(shake === 0, 'shake must settle on the death screen, got ' + shake);

  // ...and it must not follow you out to the menus either.
  reset();
  player.hp = 1;
  enemies.push(mob(player.x + 15, player.y, { speed: 0, hp: 999, maxHp: 999 }));
  update(1 / 60);
  justPressed.add('Escape');
  update(1 / 60);
  console.assert(screen === 'title', 'setup: Esc should leave to the title');
  for (let i = 0; i < 150; i++) update(1 / 60);
  console.assert(shake === 0, 'the title must not inherit a shake, got ' + shake);

  // "off" has to actually mean off, not merely smaller.
  shakeLevel = 0;
  reset();
  enemies.push(mob(player.x + 15, player.y, { speed: 0, hp: 999, maxHp: 999 }));
  update(1 / 60);
  console.assert(shake === 0, 'shake "off" must not shake at all, got ' + shake);
  shakeLevel = 2;

  // Every sound must actually be loud enough to hear. Render each one offline
  // through the real voice() and measure its peak. This is the check that was
  // missing when every sound shipped 20-30dB too quiet to notice.
  (async () => {
    for (const [name, spec] of Object.entries(SOUNDS)) {
      const off = new OfflineAudioContext(1, 44100, Math.ceil(44100 * (spec.dur + 0.05)));
      voice(off, off.destination, spec, 0);
      const d = (await off.startRendering()).getChannelData(0);
      let peak = 0;
      for (let i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i]));
      console.assert(peak >= 0.15,
        'sound "' + name + '" is too quiet to hear: peak ' + peak.toFixed(3) +
        ' (' + (20 * Math.log10(peak)).toFixed(1) + ' dBFS)');
    }
    console.log('sound level checks done');
  })();

  reset();
  console.log('checks done');
}

requestAnimationFrame(frame);
</script>
